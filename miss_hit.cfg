# Keep the historical MATLAB interface and console-output behaviour.
project_root
tab_width: 4
indent_function_file_body: 0
newline_style: "lf"
enforce_encoding: "utf-8"
suppress_rule: "copyright_notice"
suppress_rule: "naming_scripts"
suppress_rule: "naming_functions"
suppress_rule: "naming_parameters"
suppress_rule: "naming_classes"
suppress_rule: "naming_enumerations"
# Long signatures and archived experiment menus are retained.
suppress_rule: "line_length"
suppress_rule: "file_length"
# Adding semicolons would change which experiment results are printed.
suppress_rule: "end_of_statements"
# Leading operators keep long, existing mathematical expressions readable.
suppress_rule: "operator_after_continuation"
